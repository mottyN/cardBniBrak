<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>תודה על הפנייה - לוח כרטיסים בני ברק</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@500;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ocean: #0993b4;
            --ocean-deep: #0b6e87;
            --turquoise: #29c8e0;
            --coral: #ff6f61;
            --ink: #103c4a;
            --muted: #58808f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', 'Segoe UI', Tahoma, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background:
                linear-gradient(180deg, rgba(223, 245, 252, 0.55) 0%, rgba(147, 218, 237, 0.35) 55%, rgba(99, 198, 224, 0.45) 100%),
                url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .thanks-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 26px;
            box-shadow: 0 18px 40px rgba(8, 76, 97, 0.18);
            padding: 3rem 2.5rem;
            text-align: center;
            max-width: 460px;
            width: 100%;
            animation: rise 0.6s ease both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .thanks-card .icon {
            font-size: 3.4rem;
            color: var(--ocean);
            margin-bottom: 1.2rem;
            display: inline-block;
            animation: bob 3.5s ease-in-out infinite;
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0) rotate(-4deg);
            }

            50% {
                transform: translateY(-7px) rotate(4deg);
            }
        }

        h1 {
            font-family: 'Rubik', 'Heebo', sans-serif;
            font-weight: 900;
            font-size: 1.9rem;
            margin-bottom: 0.8rem;
        }

        p {
            color: var(--muted);
            margin-bottom: 1.8rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 30px;
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(120deg, var(--turquoise), var(--ocean));
            box-shadow: 0 8px 22px rgba(9, 147, 180, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(9, 147, 180, 0.5);
        }
    </style>
</head>

<body>
    <div class="thanks-card">
        <i class="fas fa-envelope-circle-check icon"></i>
        <h1>הפנייה נשלחה בהצלחה!</h1>
        <p>תודה שפנית אלינו 🌴<br>קיבלנו את ההודעה שלך במייל ונחזור אליך בהקדם.</p>
        <a class="btn" href="home.html"><i class="fas fa-umbrella-beach"></i> חזרה ללוח הכרטיסים</a>
    </div>
</body>

</html>
