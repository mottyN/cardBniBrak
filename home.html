<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>לוח כרטיסים - בני ברק</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ocean: #0993b4;
            --ocean-deep: #0b6e87;
            --turquoise: #29c8e0;
            --coral: #ff6f61;
            --coral-deep: #ee5a4a;
            --sunset: #ffb457;
            --sand: #fff8ee;
            --ink: #103c4a;
            --muted: #58808f;
            --radius: 22px;
            --shadow: 0 18px 40px rgba(8, 76, 97, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', 'Segoe UI', Tahoma, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background:
                linear-gradient(180deg, rgba(223, 245, 252, 0.55) 0%, rgba(147, 218, 237, 0.35) 55%, rgba(99, 198, 224, 0.45) 100%),
                url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
            background-size: cover;
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }

        /* שמש עדינה בפינה */
        body::before {
            content: '';
            position: fixed;
            top: -130px;
            left: -130px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 216, 106, 0.9) 0%, rgba(255, 180, 87, 0.35) 55%, transparent 72%);
            z-index: -1;
            pointer-events: none;
        }

        /* הילת ענן רכה בתחתית */
        body::after {
            content: '';
            position: fixed;
            bottom: -180px;
            right: -120px;
            width: 560px;
            height: 440px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.45), transparent 65%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            background: linear-gradient(120deg, #ff9a62 0%, #ff6f61 48%, #f857a6 100%);
            padding: 3.4rem 1rem 5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header-bubbles,
        .header-bubbles::before,
        .header-bubbles::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .header-bubbles {
            width: 220px;
            height: 220px;
            top: -80px;
            right: 8%;
            animation: drift 9s ease-in-out infinite alternate;
        }

        .header-bubbles::before {
            width: 130px;
            height: 130px;
            top: 160px;
            right: -190px;
        }

        .header-bubbles::after {
            width: 90px;
            height: 90px;
            top: 40px;
            right: 380px;
        }

        @keyframes drift {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(22px);
            }
        }

        .header-wave {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 72px;
            display: block;
        }

        h1 {
            font-family: 'Rubik', 'Heebo', sans-serif;
            font-weight: 900;
            color: #fff;
            font-size: 2.9rem;
            letter-spacing: -0.5px;
            text-shadow: 0 6px 24px rgba(150, 40, 70, 0.35);
            position: relative;
            z-index: 1;
        }

        h1 i {
            color: #ffe8a3;
            margin-left: 0.4rem;
            display: inline-block;
            animation: bob 3.5s ease-in-out infinite;
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0) rotate(-4deg);
            }

            50% {
                transform: translateY(-7px) rotate(4deg);
            }
        }

        .subtitle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 1rem;
            color: #fff;
            font-weight: 500;
            font-size: 1.05rem;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 0.5rem 1.3rem;
            border-radius: 999px;
            backdrop-filter: blur(6px);
            position: relative;
            z-index: 1;
        }

        .subtitle i {
            color: #ffe8a3;
        }

        main {
            max-width: 860px;
            margin: 1.6rem auto 2rem;
            padding: 0 1rem;
        }

        .user-section,
        .search-section,
        .posts-section {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius);
            padding: 1.8rem 2rem;
            margin-bottom: 1.4rem;
            box-shadow: var(--shadow);
            animation: rise 0.6s ease both;
        }

        .search-section {
            animation-delay: 0.08s;
        }

        .posts-section {
            animation-delay: 0.16s;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .welcome-text {
            font-size: 1.2rem;
            color: var(--ink);
            font-weight: 600;
        }

        .welcome-text i {
            color: var(--ocean);
        }

        .btn {
            padding: 12px 26px;
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(120deg, #ff9a62, var(--coral));
            color: white;
            box-shadow: 0 8px 22px rgba(255, 111, 97, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 111, 97, 0.5);
        }

        .btn-secondary {
            background: #fff;
            color: var(--ocean-deep);
            border: 2px solid rgba(9, 147, 180, 0.35);
            box-shadow: 0 6px 16px rgba(8, 76, 97, 0.1);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            border-color: var(--ocean);
            box-shadow: 0 10px 24px rgba(8, 76, 97, 0.16);
        }

        .btn-success {
            background: linear-gradient(120deg, var(--turquoise), var(--ocean));
            color: white;
            box-shadow: 0 8px 22px rgba(9, 147, 180, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(9, 147, 180, 0.5);
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.7);
            color: #d64545;
            border: 2px solid rgba(214, 69, 69, 0.3);
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            border-color: #d64545;
            background: #fff5f4;
        }

        .search-container {
            display: flex;
            gap: 1rem;
            align-items: stretch;
        }

        .search-input-container {
            flex: 1;
            display: flex;
            align-items: center;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 22px;
            border: 2px solid #d5eaf1;
            border-radius: 999px;
            font-family: inherit;
            font-size: 1.05rem;
            color: var(--ink);
            transition: all 0.3s ease;
            background: #fbfeff;
        }

        .search-input::placeholder {
            color: #8fb2bd;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--turquoise);
            box-shadow: 0 0 0 4px rgba(41, 200, 224, 0.18);
        }

        .search-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .search-filter-btn {
            padding: 14px 20px;
            border: 2px solid #d5eaf1;
            border-radius: 999px;
            background: #fbfeff;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .search-filter-btn.active {
            background: linear-gradient(120deg, var(--turquoise), var(--ocean));
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(9, 147, 180, 0.35);
        }

        .search-filter-btn:hover:not(.active) {
            border-color: var(--turquoise);
            color: var(--ocean-deep);
        }

        .section-title {
            font-family: 'Rubik', 'Heebo', sans-serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 1.6rem;
            text-align: center;
            position: relative;
        }

        .section-title i {
            color: var(--ocean);
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 5px;
            background: linear-gradient(90deg, var(--sunset), var(--coral));
            border-radius: 999px;
        }

        /* Tabs styling */
        .tabs-container {
            margin-bottom: 1rem;
        }

        .tabs {
            display: flex;
            background: rgba(9, 147, 180, 0.08);
            border-radius: 999px;
            padding: 6px;
            margin-bottom: 1.6rem;
        }

        .tab {
            flex: 1;
            padding: 13px 20px;
            text-align: center;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab.active {
            background: linear-gradient(120deg, var(--turquoise), var(--ocean));
            color: white;
            box-shadow: 0 6px 18px rgba(9, 147, 180, 0.35);
        }

        .tab:hover:not(.active) {
            color: var(--ocean-deep);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: #ffffff;
            color: var(--ink);
            padding: 1.6rem 1.5rem 1.4rem;
            border-radius: 18px;
            border: 1px solid #e3f2f7;
            box-shadow: 0 10px 26px rgba(8, 76, 97, 0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* פס צבע עליון לפי סוג המודעה */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
        }

        .card.sell-card::before {
            background: linear-gradient(90deg, var(--sunset), var(--coral));
        }

        .card.buy-card::before {
            background: linear-gradient(90deg, var(--turquoise), var(--ocean));
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 36px rgba(8, 76, 97, 0.16);
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .card-type-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .sell-card .card-type-badge {
            background: #fff0e8;
            color: var(--coral-deep);
        }

        .buy-card .card-type-badge {
            background: #e3f8fc;
            color: var(--ocean-deep);
        }

        .card-title {
            font-family: 'Rubik', 'Heebo', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            margin-top: 14px;
            color: var(--ink);
        }

        .card-info {
            margin-bottom: 0.5rem;
            font-size: 0.98rem;
            color: #335966;
        }

        .card-info strong {
            color: var(--coral-deep);
        }

        .buy-card .card-info strong {
            color: var(--ocean-deep);
        }

        .delete-btn {
            margin-top: 1rem;
            background: #fff2f0;
            color: #d64545;
            border: 2px solid rgba(214, 69, 69, 0.3);
            padding: 8px 18px;
            border-radius: 999px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #d64545;
            border-color: #d64545;
            color: #fff;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 45, 60, 0.45);
            backdrop-filter: blur(6px);
        }

        .modal-content {
            background: #ffffff;
            margin: 2% auto;
            padding: 0;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 95vh;
            box-shadow: 0 30px 60px rgba(6, 45, 60, 0.35);
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            animation: rise 0.35s ease both;
        }

        .modal-header {
            background: linear-gradient(120deg, var(--turquoise), var(--ocean));
            padding: 1.2rem 1.5rem;
            flex-shrink: 0;
        }

        .modal-title {
            color: white;
            font-family: 'Rubik', 'Heebo', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
        }

        .close {
            position: absolute;
            top: 14px;
            left: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
            z-index: 2;
        }

        .close:hover {
            color: #ffe8a3;
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.5rem;
            flex: 1;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            color: var(--ink);
            font-weight: 600;
            margin-bottom: 0.45rem;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #d5eaf1;
            border-radius: 14px;
            background: #fbfeff;
            color: var(--ink);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: #8fb2bd;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--turquoise);
            box-shadow: 0 0 0 4px rgba(41, 200, 224, 0.18);
            background: #fff;
        }

        .form-select {
            cursor: pointer;
        }

        .form-select option {
            background: #fff;
            color: var(--ink);
        }

        .modal-footer {
            padding: 1rem 1.5rem 1.3rem;
            text-align: center;
            border-top: 1px solid #e8f4f8;
            flex-shrink: 0;
        }

        .error-message {
            color: #d64545;
            font-size: 0.88rem;
            margin-top: 0.4rem;
            display: none;
        }

        .form-input.error {
            border-color: var(--coral);
            background: #fff6f5;
        }

        textarea.form-input {
            resize: vertical;
            min-height: 110px;
            border-radius: 14px;
        }

        .contact-open-btn {
            margin-bottom: 1.2rem;
        }

        .form-note {
            text-align: center;
            color: var(--muted);
            font-size: 0.88rem;
            margin-top: 1rem;
        }

        .hide {
            display: none;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            margin-top: 1rem;
            color: #114b5f;
            font-size: 0.92rem;
        }

        .footer i {
            color: var(--ocean-deep);
        }

        .footer a {
            color: var(--coral-deep);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            color: var(--muted);
            padding: 2rem;
        }

        .error {
            text-align: center;
            color: #c0392b;
            padding: 2rem;
            background: #fdefed;
            border: 1px solid #f6cfc9;
            border-radius: 14px;
            margin: 1rem 0;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 3rem 2rem;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.45;
            color: var(--ocean);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.4rem;
        }

        /* הודעות מצב תופסות את כל רוחב הגריד */
        .cards-grid .empty-state,
        .cards-grid .loading,
        .cards-grid .error {
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.1rem;
            }

            header {
                padding: 2.6rem 1rem 4.4rem;
            }

            .user-section,
            .search-section,
            .posts-section {
                padding: 1.4rem 1.2rem;
            }

            .user-info {
                flex-direction: column;
                text-align: center;
            }

            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                border-radius: 18px;
            }

            .tab {
                padding: 12px 10px;
                font-size: 0.92rem;
            }

            .modal-content {
                margin: 1% auto;
                width: 95%;
                max-height: 98vh;
            }

            .modal-body {
                padding: 1rem;
            }

            .modal-header {
                padding: 1rem;
            }

            .modal-footer {
                padding: 1rem;
            }

            .search-container {
                flex-direction: column;
            }

            .search-filters {
                justify-content: center;
            }

            .search-filter-btn {
                flex: 1;
                min-width: 120px;
                justify-content: center;
            }
        }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NQC5HC90L7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-NQC5HC90L7');
    </script>

</head>

<body>
    <header>
        <div class="header-bubbles" aria-hidden="true"></div>
        <h1><i class="fas fa-umbrella-beach"></i> לוח החלפת כרטיסים</h1>
        <div class="subtitle"><i class="fas fa-sun"></i> בני ברק • חופשת קיץ תשפ"ו</div>
        <svg class="header-wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,42 C240,88 480,4 720,32 C960,60 1200,12 1440,46 L1440,80 L0,80 Z"
                fill="rgba(255,255,255,0.35)" />
            <path d="M0,56 C240,94 480,28 720,52 C960,76 1200,34 1440,62 L1440,80 L0,80 Z"
                fill="rgba(255,255,255,0.65)" />
        </svg>
    </header>

    <main>
        <div class="user-section">
            <div id="postSection" class="hide">
                <div class="user-info">
                    <div class="welcome-text">
                        <i class="fas fa-user-circle"></i> שלום <span id="userName"></span>!
                    </div>
                    <div>
                        <button class="btn btn-success" onclick="openModal()">
                            <i class="fas fa-plus"></i> פרסם מודעה חדשה
                        </button>
                        <button class="btn btn-logout" onclick="signOut()">
                            <i class="fas fa-sign-out-alt"></i> התנתק
                        </button>
                    </div>
                </div>
            </div>

            <div id="loginPrompt">
                <div style="text-align: center;">
                    <button class="btn btn-primary" onclick="signInWithGoogle()">
                        <i class="fab fa-google"></i> התחבר עם גוגל כדי לפרסם מודעה
                    </button>
                </div>
            </div>
        </div>

        <div class="search-section">
            <div class="section-title">
                <i class="fas fa-search"></i> חיפוש מודעות
            </div>
            <div class="search-container">
                <div class="search-input-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="הקלד שם אירוע או קוד...">
                </div>
                <div class="search-filters">

                    <button class="search-filter-btn" data-filter="sell">
                        <i class="fas fa-tag"></i> למכירה
                    </button>
                    <button class="search-filter-btn" data-filter="buy">
                        <i class="fas fa-shopping-cart"></i> מחפשים לקנות
                    </button>
                </div>
            </div>
        </div>

        <div class="posts-section">
            <div class="section-title">
                <i class="fas fa-list"></i> מודעות קיימות
            </div>

            <div class="tabs-container">
                <div class="tabs">
                    <div class="tab active" data-tab="sell">
                        <i class="fas fa-tag"></i> למכירה
                    </div>
                    <div class="tab" data-tab="buy">
                        <i class="fas fa-shopping-cart"></i> מחפשים לקנות
                    </div>
                </div>

                <div id="sellTab" class="tab-content active">

                // Check if token exists and is not expired (with 5 minute buffer)
                const now = Date.now();

                    // Set up auto-refresh timer (refresh 5 minutes before expiry)

            scheduleTokenRefresh() {
                if (this.refreshTimer) {

                if (!this.tokenExpiry) return;

                const now = Date.now();
                const timeUntilRefresh = this.tokenExpiry - now - (10 * 60 * 1000); // Refresh 10 minutes before expiry

                if (timeUntilRefresh > 0) {
                    this.refreshTimer = setTimeout(async () => {
                        try {

                        }
                    }, timeUntilRefresh);
                }
            }

                this.token = null;
                this.tokenExpiry = null;
                if (this.refreshTimer) {
                    clearTimeout(this.refreshTimer);
                    this.refreshTimer = null;
                }
            }
        }

        const tokenManager = new TokenManager();

        // Enhanced Firestore REST API Helper Functions
        class FirestoreREST {
            constructor(projectId, apiKey) {
                this.projectId = projectId;
                this.apiKey = apiKey;
                this.baseURL = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents`;
            }

            // Convert JavaScript value to Firestore value format
            toFirestoreValue(value) {
                if (value === null || value === undefined) {
                    return { nullValue: null };
                }
                if (typeof value === 'string') {
                    return { stringValue: value };
                }
                if (typeof value === 'number') {
                    return Number.isInteger(value) ? { integerValue: value.toString() } : { doubleValue: value };
                }
                if (typeof value === 'boolean') {
                    return { booleanValue: value };
                }
                if (value instanceof Date) {
                    return { timestampValue: value.toISOString() };
                }
                if (Array.isArray(value)) {
                    return {
                        arrayValue: {
                            values: value.map(v => this.toFirestoreValue(v))
                        }
                    };
                }
                if (typeof value === 'object') {
                    const fields = {};
                    for (const [key, val] of Object.entries(value)) {
                        fields[key] = this.toFirestoreValue(val);
                    }
                    return { mapValue: { fields } };
                }
                return { stringValue: String(value) };
            }

            // Convert Firestore value format to JavaScript value
            fromFirestoreValue(value) {
                if (!value) return null;

                if (value.stringValue !== undefined) return value.stringValue;
                if (value.integerValue !== undefined) return parseInt(value.integerValue);
                if (value.doubleValue !== undefined) return parseFloat(value.doubleValue);
                if (value.booleanValue !== undefined) return value.booleanValue;
                if (value.timestampValue !== undefined) return new Date(value.timestampValue);
                if (value.nullValue !== undefined) return null;
                if (value.arrayValue) {
                    return value.arrayValue.values ? value.arrayValue.values.map(v => this.fromFirestoreValue(v)) : [];
                }
                if (value.mapValue && value.mapValue.fields) {
                    const obj = {};
                    for (const [key, val] of Object.entries(value.mapValue.fields)) {
                        obj[key] = this.fromFirestoreValue(val);
                    }
                    return obj;
                }
                return null;
            }

            // Enhanced HTTP request with retry logic
            async makeRequest(url, options = {}, retries = 3) {
                for (let attempt = 1; attempt <= retries; attempt++) {
                    try {
                        const response = await fetch(url, options);

                        if (response.status === 401) {
                            // Token expired, clear it and try to get a new one
                            console.log('טוקן פג תוקף, מנסה לרענן...');
                            tokenManager.clearToken();

                            if (attempt < retries) {
                                // Get fresh token and retry
                                const newToken = await tokenManager.getValidToken();
                                if (options.headers) {
                                    options.headers['Authorization'] = `Bearer ${newToken}`;
                                }
                                continue;
                            }
                        }

                        if (response.status === 429) {
                            // יותר מדי בקשות - להמתין לפי הוראת השרת לפני ניסיון חוזר
                            if (attempt < retries) {
                                const retryAfter = parseInt(response.headers.get('Retry-After'), 10) || attempt * 10;
                                console.warn(`יותר מדי בקשות, ממתין ${retryAfter} שניות לפני ניסיון חוזר...`);
                                await new Promise(resolve => setTimeout(resolve, retryAfter * 1000));
                                continue;
                            }
                            throw new Error('יותר מדי בקשות לשרת - אנא המתן דקה ונסה שוב');
                        }

                        if (!response.ok) {
                            const errorText = await response.text();
                            console.error(`HTTP ${response.status}: ${errorText}`);
                            throw new Error(`שגיאת שרת: ${response.status} - ${response.statusText}`);
                        }

                        return response;
                    } catch (error) {
                        console.error(`ניסיון ${attempt} נכשל:`, error);

                        if (attempt === retries) {
                            throw error;
                        }

                        // Wait before retry (exponential backoff)
                        await new Promise(resolve => setTimeout(resolve, Math.pow(2, attempt) * 1000));
                    }
                }
            }

            // Get documents from collection

            async getDocuments(collectionName, orderBy = null) {
                try {
                    const { token: appCheckToken } = await getToken(appCheck, false);

                    // דורש משתמש מחובר וטוקן תקף
                    const token1 = await tokenManager.getValidToken();

                    let url = `${this.baseURL}/${collectionName}?key=${this.apiKey}`;
                    if (orderBy) {
                        url += `&orderBy=${orderBy.field}%20${orderBy.direction || 'desc'}`;
                    }

                    const response = await this.makeRequest(url, {
                        headers: {
                            'Authorization': `Bearer ${token1}`,
                            "X-Firebase-AppCheck": appCheckToken // חשוב: כותרת אימות גם לקריאה
                        }
                    });

                    const data = await response.json();
                    if (!data.documents) {
                        return [];
                    }

                    return data.documents.map(doc => {
                        const id = doc.name.split('/').pop();
                        const fields = {};
                        if (doc.fields) {
                            for (const [key, value] of Object.entries(doc.fields)) {
                                fields[key] = this.fromFirestoreValue(value);
                            }
                        }
                        return { id, ...fields };
                    });

                } catch (error) {
                    console.error('שגיאה בטעינת מסמכים:', error);
                    // הודעה ברורה כשאין התחברות/אימות
                    if (error.message.includes('לא מחובר') || error.message.includes('אימות') || error.message.includes('401')) {
                        throw new Error('יש להתחבר עם גוגל כדי לצפות במודעות');
                    }
                    throw error;
                }
            }


            // Add document to collection
            async addDocument(collectionName, data) {
                try {
                    
                    const { token: appCheckToken } = await getToken(appCheck, false);

                    const fields = {};
                    for (const [key, value] of Object.entries(data)) {
                        fields[key] = this.toFirestoreValue(value);
                    }

                    const token1 = await tokenManager.getValidToken();

                    const response = await this.makeRequest(
                        `${this.baseURL}/${collectionName}?key=${this.apiKey}`,
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token1}`,
                                "X-Firebase-AppCheck": appCheckToken
                            },
                            body: JSON.stringify({ fields })
                        }
                    );

                    const result = await response.json();
                    return result.name.split('/').pop(); // Return document ID
                } catch (error) {
                    console.error('שגיאה בהוספת מסמך:', error);
                    if (error.message.includes('401') || error.message.includes('אימות')) {
                        throw new Error('שגיאה באימות - אנא התחבר מחדש');
                    }
                    throw error;
                }
            }

            // Delete document
            async deleteDocument(collectionName, docId) {
                try {
                    const { token: appCheckToken } = await getToken(appCheck, false);

                    const token1 = await tokenManager.getValidToken();

                    const response = await this.makeRequest(

                        throw new Error('שגיאה באימות - אנא התחבר מחדש');
                    }
                    throw error;
                }
            }
        }

            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        // Update form based on post type
        function updateFormForPostType() {
            const postType = document.getElementById('postType');
            const ticketCountLabel = document.getElementById('ticketCountLabel');
            const ticketCountInput = document.getElementById('ticketCount');

            postType.addEventListener('change', () => {
                if (postType.value === 'buy') {
                    ticketCountLabel.textContent = 'כמה כרטיסים מחפש';
                    ticketCountInput.placeholder = 'כמה כרטיסים אתה מחפש';
                } else {
                    ticketCountLabel.textContent = 'מספר כרטיסים';
                    ticketCountInput.placeholder = 'כמה כרטיסים יש לך';
                }
            });
        }

        // Real-time validation for event code
        function initializeEventCodeValidation() {
            const eventCodeInput = document.getElementById('eventCode');
            const errorElement = document.getElementById('eventCodeError');

            eventCodeInput.addEventListener('input', function (e) {
                let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
                if (value.length > 3) {
                    value = value.slice(0, 3); // Limit to 3 digits
                }
                e.target.value = value;

                // Show/hide error message
                if (value.length === 0) {
                    errorElement.style.display = 'none';
                    e.target.classList.remove('error');
                } else if (value.length < 3) {
                    errorElement.textContent = `נדרשות ${3 - value.length} ספרות נוספות`;
                    errorElement.style.display = 'block';
                    e.target.classList.add('error');
                } else {
                    errorElement.style.display = 'none';
                    e.target.classList.remove('error');
                }
            });
        }

        // Authentication handlers
        onAuthStateChanged(auth, async user => {
            if (user) {
                loginPrompt.classList.add('hide');
                postSection.classList.remove('hide');
                userNameSpan.textContent = user.displayName;
                currentUserEmail = user.email;
                currentUser = user;

                // Initialize token on login
                try {
                    await tokenManager.getValidToken();
                    console.log('אימות הושלם בהצלחה');
                } catch (error) {
                    console.error('שגיאה באימות ראשוני:', error);
                }

                loadPosts();
            } else {
                loginPrompt.classList.remove('hide');
                postSection.classList.add('hide');
                currentUserEmail = null;
                currentUser = null;
                tokenManager.clearToken();
                // איפוס המטמון בהתנתקות
                cachedPosts = [];
                lastFetchTime = 0;
                loadPosts();
            }
        });

        window.signInWithGoogle = async function () {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error('שגיאה בהתחברות:', error);
                alert('שגיאה בהתחברות: ' + error.message);
            }
        }

        window.signOut = async function () {
            try {
                tokenManager.clearToken();
                await signOut(auth);
            } catch (error) {
                console.error('שגיאה בהתנתקות:', error);
            }
        }

        // Modal handlers
        window.openModal = function () {
            document.getElementById('postModal').style.display = 'block';
        }

        window.closeModal = function () {
            document.getElementById('postModal').style.display = 'none';
            document.getElementById('postForm').reset();

            // Clear all error messages
            const errorMessages = document.querySelectorAll('.error-message');
            const inputs = document.querySelectorAll('.form-input, .form-select');

            errorMessages.forEach(msg => {
                msg.style.display = 'none';
            });

            inputs.forEach(input => {
                input.classList.remove('error');
            });
        }

        // Form submission
        document.getElementById('postForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            if (!currentUserEmail || !currentUser) {
                alert('אנא התחבר קודם');
                return;
            }

            // Validate form
            if (!validateForm()) {
                return;
            }

            const submitBtn = document.querySelector('#postModal button[type="submit"]');
            const originalText = submitBtn.innerHTML;

            try {
                // Show loading state immediately
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> מפרסם...';
                submitBtn.disabled = true;

                const postType = document.getElementById('postType').value;
                const eventName = document.getElementById('eventName').value.trim();
                const eventCode = document.getElementById('eventCode').value.trim();
                const ticketCount = parseInt(document.getElementById('ticketCount').value);
                const contactName = document.getElementById('contactName').value.trim();
                const contactPhone = document.getElementById('contactPhone').value.trim();

                const post = {
                    postType,
                    eventName,
                    eventCode,
                    ticketCount,
                    contactName,
                    contactPhone,
                    email: currentUserEmail,
                    createdAt: new Date(),
                    userId: currentUser.uid
                };

                console.log('שולח מודעה:', post);
                await firestoreREST.addDocument(COLLECTION_NAME, post);
                console.log('מודעה נשלחה בהצלחה');

                alert('המודעה פורסמה בהצלחה! 🎉');
                closeModal();
                await loadPosts(true);

            } catch (error) {
                console.error('שגיאה בפרסום המודעה:', error);

                if (error.message.includes('אימות') || error.message.includes('התחבר')) {
                    alert('בעיית אימות - אנא התחבר מחדש');
                    await signOut(auth);
                } else {
                    alert('שגיאה: ' + error.message);
                }
            } finally {
                // Always reset button state
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById('postModal');
            if (event.target == modal) {
                closeModal();
            }
            const contactModal = document.getElementById('contactModal');
            if (event.target == contactModal) {
                closeContactModal();
            }
        }

        // Search functionality - סינון מקומי בלבד, בלי קריאה לשרת
        document.getElementById('searchInput').addEventListener('input', () => {
            if (currentUser) renderPosts();
        });

        // מטמון מודעות - מונע קריאות שרת מיותרות (הסינון נעשה בצד הלקוח)
        let cachedPosts = [];
        let lastFetchTime = 0;
        let fetchPromise = null;
        const POSTS_CACHE_TTL = 30000; // 30 שניות

        // Load posts function with enhanced filtering
        async function loadPosts(forceRefresh = false) {
            if (!currentUser) {
                // אופציונלי: נקה/הצג מצב ריק
                document.getElementById('sellPosts').innerHTML = `
      <div class="empty-state"><i class="fas fa-lock"></i>
        עליך להתחבר כדי לצפות במודעות
      </div>`;
                document.getElementById('buyPosts').innerHTML = `
      <div class="empty-state"><i class="fas fa-lock"></i>
        עליך להתחבר כדי לצפות במודעות
      </div>`;
                return;
            }
            try {
                // אם הנתונים במטמון עדיין טריים - להציג מהמטמון בלי לפנות לשרת
                if (!forceRefresh && lastFetchTime && (Date.now() - lastFetchTime) < POSTS_CACHE_TTL) {
                    renderPosts();
                    return;
                }

                const sellContainer = document.getElementById('sellPosts');
                const buyContainer = document.getElementById('buyPosts');

                sellContainer.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> טוען מודעות...</div>';
                buyContainer.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> טוען מודעות...</div>';

                // מניעת בקשות כפולות במקביל - כולם ממתינים לאותה בקשה
                if (!fetchPromise) {
                    fetchPromise = firestoreREST.getDocuments(COLLECTION_NAME, {
                        field: 'createdAt',
                        direction: 'desc'
                    }).finally(() => { fetchPromise = null; });
                }
                cachedPosts = await fetchPromise;
                lastFetchTime = Date.now();

                renderPosts();
            } catch (error) {
                console.error('שגיאה בטעינת המודעות:', error);
                const errorHtml = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i>
                        שגיאה בטעינת המודעות: ${error.message}
                        <br><br>
                        <button class="btn btn-secondary" onclick="loadPosts(true)">
                            <i class="fas fa-refresh"></i> נסה שוב
                        </button>
                    </div>
                `;
                document.getElementById('sellPosts').innerHTML = errorHtml;
                document.getElementById('buyPosts').innerHTML = errorHtml;
            }
        }

        // הצגת המודעות מהמטמון עם סינון מקומי (חיפוש + פילטר) - בלי קריאות שרת
        function renderPosts() {
            const sellContainer = document.getElementById('sellPosts');
            const buyContainer = document.getElementById('buyPosts');

            const searchValue = document.getElementById('searchInput').value.toLowerCase().trim();
            const posts = cachedPosts;

            sellContainer.innerHTML = '';
                buyContainer.innerHTML = '';

                let hasSellResults = false;
                let hasBuyResults = false;

                posts.forEach(post => {
                    // Apply search filter
                    const matchesSearch = searchValue === '' ||
                        (post.eventName && post.eventName.toLowerCase().includes(searchValue)) ||
                        (post.eventCode && post.eventCode.toLowerCase().includes(searchValue));

                    // Apply type filter
                    const matchesTypeFilter = currentSearchFilter === 'all' ||
                        post.postType === currentSearchFilter;

                    if (matchesSearch && matchesTypeFilter) {
                        const div = document.createElement('div');
                        div.className = `card ${post.postType === 'buy' ? 'buy-card' : 'sell-card'}`;

                        // Format creation date
                        let dateStr = '';
                        if (post.createdAt) {
                            const date = new Date(post.createdAt);
                            dateStr = date.toLocaleDateString('he-IL') + ' ' + date.toLocaleTimeString('he-IL', {
                                hour: '2-digit',
                                minute: '2-digit'
                            });
                        }

                        const postTypeText = post.postType === 'buy' ? 'מחפש לקנות' : 'למכירה';
                        const ticketText = post.postType === 'buy' ? 'כרטיסים' : 'כרטיסים';

                        div.innerHTML = `
                            <div class="card-type-badge">${postTypeText}</div>
                            <div class="card-content">
                                <div class="card-title">${post.eventName || 'ללא שם'}</div>
                                <div class="card-info"><strong>קוד:</strong> ${post.eventCode || 'ללא קוד'}</div>
                                <div class="card-info"><strong>${ticketText}:</strong> ${post.ticketCount || 0}</div>
                                <div class="card-info"><strong>שם ליצירת קשר:</strong> ${post.contactName || 'ללא שם'}</div>
                                <div class="card-info"><strong>טלפון / מייל:</strong> ${post.contactPhone || 'ללא פרטים'}</div>
                                ${dateStr ? `<div class="card-info"><strong>תאריך פרסום:</strong> ${dateStr}</div>` : ''}
                                ${post.email === currentUserEmail ?
                                `<button class="delete-btn" onclick="deletePost('${post.id}')">
                                        <i class="fas fa-trash"></i> מחק מודעה
                                    </button>` : ''}
                            </div>
                        `;

                        if (post.postType === 'buy') {
                            buyContainer.appendChild(div);
                            hasBuyResults = true;
                        } else {
                            sellContainer.appendChild(div);
                            hasSellResults = true;
                        }
                    }
                });

                if (!hasSellResults) {
                    sellContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-tag"></i>
                            <div>אין מודעות מכירה כרגע</div>
                            <div style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.7;">
                                ${searchValue || currentSearchFilter !== 'all' ? 'נסה לשנות את החיפוש או המסנן' : 'היה הראשון לפרסם מודעת מכירה!'}
                            </div>
                        </div>
                    `;
                }

                if (!hasBuyResults) {
                    buyContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-shopping-cart"></i>
                            <div>אין בקשות לקנייה כרגע</div>
                            <div style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.7;">
                                ${searchValue || currentSearchFilter !== 'all' ? 'נסה לשנות את החיפוש או המסנן' : 'היה הראשון לפרסם בקשה לקנייה!'}
                            </div>
                        </div>
                    `;
                }
        }

        // חשיפת loadPosts לכפתור "נסה שוב" (הסקריפט הוא module)
        window.loadPosts = loadPosts;

        // Delete post function
        window.deletePost = async function (docId) {
            if (!currentUser) {
                alert('אנא התחבר קודם');
                return;
            }

            if (confirm('האם אתה בטוח שברצונך למחוק את המודעה?')) {
                try {
                    await firestoreREST.deleteDocument(COLLECTION_NAME, docId);
                    await loadPosts(true);
                    alert('המודעה נמחקה בהצלחה');
                } catch (error) {
                    console.error('שגיאה במחיקת המודעה:', error);

                    if (error.message.includes('אימות') || error.message.includes('התחבר')) {
                        alert('בעיית אימות - אנא התחבר מחדש');
                        await signOut(auth);
                    } else {
                        alert('שגיאה במחיקת המודעה: ' + error.message);
                    }
                }
            }
        }

        // ===== טופס פנייה להנהלת האתר (נשלח למייל דרך FormSubmit) =====
        window.openContactModal = function () {
            document.getElementById('contactModal').style.display = 'block';
        }

        window.closeContactModal = function () {
            document.getElementById('contactModal').style.display = 'none';
            document.getElementById('contactModalForm').reset();
        }

        // Initialize components
        initializeTabs();
        initializeSearchFilters();
        updateFormForPostType();
        initializeEventCodeValidation();

        // Load posts on page load
        loadPosts();

        // Add keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            // ESC to close modal
            if (e.key === 'Escape') {
                closeModal();
                closeContactModal();
            }

            // Ctrl+K to focus search
            if (e.ctrlKey && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }

            // Enter in modal inputs should submit form (except for event code)
            if (e.key === 'Enter' && e.target.classList.contains('form-input') && e.target.id !== 'eventCode'
                && !e.target.closest('#contactModal')) {
                e.preventDefault();
                const form = document.getElementById('postForm');
                const event = new Event('submit', { cancelable: true });
                form.dispatchEvent(event);
            }
        });

        // Auto-refresh posts every 30 seconds
        // setInterval(async () => {
        //     if (!document.hidden) { // Only refresh if page is visible
        //         try {
        //             await loadPosts();
        //         } catch (error) {
        //             console.error('שגיאה ברענון אוטומטי:', error);
        //         }
        //     }
        // }, 30000);

        // Handle page visibility change
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // Page became visible, refresh posts
                loadPosts();
            }
        });

        // Handle online/offline status
        window.addEventListener('online', () => {
            console.log('חזרה לחיבור אינטרנט');
            loadPosts();
        });

        window.addEventListener('offline', () => {
            console.log('אין חיבור אינטרנט');
            const errorHtml = `
                <div class="error">
                    <i class="fas fa-wifi-slash"></i>
                    אין חיבור אינטרנט
                    <br><br>
                    בדוק את החיבור שלך ונסה שוב
                </div>
            `;
            const sellContainer = document.getElementById('sellPosts');
            const buyContainer = document.getElementById('buyPosts');
            if (sellContainer.innerHTML.includes('loading')) {
                sellContainer.innerHTML = errorHtml;
            }
            if (buyContainer.innerHTML.includes('loading')) {
                buyContainer.innerHTML = errorHtml;
            }
        });

        console.log('אפליקציית לוח הכרטיסים הופעלה בהצלחה עם חיפוש משופר ווולידציה');
    </script>
</body>

</html>
